<div class="product-container">
  <div class="title-product">
    <h3>{{cartItem().product.name}}</h3>
    <button (click)="removeItem(cartItem().product.id)">🗑️</button>
  </div>
  <div class="information-container" [class.summary]="mode() === 'summary'">
    <img ngSrc='{{cartItem().product.imageUrl}}' alt="" width="100" height="100">
    <div class="information-product" [class.summary]="mode() === 'summary'">
      <app-quantity-product [cartItem]="cartItem()"></app-quantity-product>
      <p><strong>Prix/u : </strong>{{cartItem().product.price.toFixed(2)}}€</p>
    </div>
  </div>
</div>
