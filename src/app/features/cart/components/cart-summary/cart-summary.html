<div class="container">
  <h2>Mon panier :</h2>
  <p>Nombre d'article dans le panier : {{productsInCart().length}}</p>
  <div class="actions">
    <button routerLink="/cart">Acheter</button>
    <button (click)="clearCart()">Vider le panier</button>
  </div>
  @for (product of productsInCart(); track product.id) {
    <div class="product-container">
      <div class="title-product">
        <h3>{{product.name}}</h3>
        <button (click)="deleteProduct(product.id)">🗑️</button>
      </div>
      <div class="information-container">
        <img ngSrc='{{product.imageUrl}}' alt="" width="100" height="100">
        <div class="information-product">
          <p></p>
          <p><strong>Quantité : </strong></p>
          <p><strong>Prix : </strong>{{product.price}}€</p>
        </div>
      </div>
    </div>
  }
  <p><strong>Prix total : </strong>{{totalPriceOfProducts()}}€</p>
</div>
