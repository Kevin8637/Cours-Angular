<div class="register-block">
  <section class="image-section">
    <h2>Section Image</h2>
  </section>
  <section class="form-section">
    <h2>S'inscrire</h2>
    <form [formGroup]="registerForm" class="register-form">
      <div class="input-section">
<!--        <label for="username">-->
<!--          Identifiant-->
<!--          <input id="username" formControlName="username" [attr.aria-invalid]="registerForm.controls.username.invalid">-->

<!--            <p class="error">L'identifiant est requis</p>-->
<!--          }-->
<!--        </label>-->

        <label for="email">
          Email
          <input id="email" type="email" formControlName="email" [attr.aria-invalid]="registerForm.controls.email.invalid">
        </label>
      </div>

      <div class="input-section">
        <label for="password">
          Mot de passe
          <input id="password" type="password" formControlName="password" [attr.aria-invalid]="registerForm.controls.password.invalid">
        @if (registerForm.controls.password.invalid && registerForm.controls.password.touched){
          <p class="error">Le mot de passe doit contenir minimum 12 caractères</p>
        }
        </label>

        <label for="confirmPassword">
          Confirmation du mot de passe
          <input id="confirmPassword" type="password" formControlName="confirmPassword" [attr.aria-invalid]="registerForm.controls.confirmPassword.invalid">
        @if (registerForm.controls.confirmPassword.invalid && registerForm.controls.confirmPassword.touched){
          <p class="error">Le mot de passe est différent du premier</p>
        }
        </label>
      </div>

<!--      <div class="input-section">-->

<!--      </form>-->

      <button type="submit" [disabled]="registerForm.invalid" (click)="onSubmit()"> S'inscrire</button>
    </form>
    <nav>
      <a routerLink="/auth/login">Se connecter</a>
    </nav>
  </section>
</div>
